name: build
on:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: [self-hosted, public, linux, x64]
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
        name: Checkout repo
        with:
          fetch-depth: 0
      - name: Run yor action
        uses: bridgecrewio/yor-action@97874abd0138bd4f62cf7fc1971530ef8dd1854e # main
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0f07f7f756721ebd886c2462646a35f78a8bc4de # v1
        with:
          python-version: 3.7
      - name: Update documentation
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git fetch --tags
          git pull
          latest_tag=$(git describe --tags `git rev-list --tags --max-count=1`)
          echo "latest tag: $latest_tag"
          new_tag=$(echo $latest_tag | awk -F. -v a="$1" -v b="$2" -v c="$3" '{printf("%d.%d.%d", $1+a, $2+b , $3+1)}')
          echo "new tag: $new_tag"

          pip install -U checkov
          cat .github/template.md > README.md && checkov -d terraform -o github_failed_only -s >> README.md
          git add README.md  || echo "No changes to commit"
          git commit -m "update resource scan result doc" README.md || echo "No changes to commit"
          git push origin
          git tag $new_tag
          git push origin $new_tag
